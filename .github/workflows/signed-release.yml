name: Signed Release
run-name: Signed release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and sign
        required: true
        default: "v0.3.1"
        type: string
      promote_release:
        description: Mark the release as stable after every signed asset passes
        required: true
        default: false
        type: boolean

concurrency:
  group: signed-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Verify main dispatch, tag, version, and release
        id: release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Signed releases must be dispatched from main."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          VERSION="$(python -c 'from clean_my_codex import APP_VERSION; print(APP_VERSION)')"
          if [[ "v$VERSION" != "$RELEASE_TAG" ]]; then
            echo "APP_VERSION does not match the requested release tag."
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          ACTUAL_TAG="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [[ "$ACTUAL_TAG" != "$RELEASE_TAG" ]]; then
            echo "The GitHub release does not match the requested tag."
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    name: Sign and notarize macOS ${{ matrix.arch }}
    needs: preflight
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install build dependency
        working-directory: source
        run: python -m pip install --disable-pip-version-check -r requirements-macos-build.txt
      - name: Audit and test tagged source
        working-directory: source
        run: |
          python scripts/audit_release.py . --allowlist PUBLIC_RELEASE_FILES.txt
          python -m unittest discover -s tests
      - name: Build architecture-specific app
        working-directory: source
        env:
          PYINSTALLER_PYTHON: python
          CLEAN_MY_CODEX_BUILD_ARCH: ${{ matrix.arch }}
        run: ./script/build_macos_app.sh
      - name: Sign, notarize, staple, and package
        env:
          CMC_MAC_CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CMC_MAC_CERT_PASS: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CMC_APPLE_KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          CMC_APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CMC_APPLE_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in CMC_MAC_CERT_B64 CMC_MAC_CERT_PASS CMC_APPLE_KEY_B64 CMC_APPLE_KEY_ID CMC_APPLE_ISSUER_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "A required release-signing environment secret is missing."
              exit 1
            fi
          done

          umask 077
          P12_PATH="$RUNNER_TEMP/clean-my-codex-signing.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/clean-my-codex-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -f "$P12_PATH" "$API_KEY_PATH"
          }
          trap cleanup EXIT

          printf '%s' "$CMC_MAC_CERT_B64" | openssl base64 -d -A -out "$P12_PATH"
          printf '%s' "$CMC_APPLE_KEY_B64" | openssl base64 -d -A -out "$API_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$CMC_MAC_CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "$SIGN_IDENTITY" ]]; then
            echo "No Developer ID Application identity was imported."
            exit 1
          fi

          OUTPUT_ARCHIVE="$GITHUB_WORKSPACE/source/dist/Clean-My-Codex-macOS-${RELEASE_ARCH}-v${RELEASE_VERSION}.zip"
          CLEAN_MY_CODEX_SIGN_IDENTITY="$SIGN_IDENTITY" \
          CLEAN_MY_CODEX_BUILD_ARCH="$RELEASE_ARCH" \
          APPLE_API_KEY_PATH="$API_KEY_PATH" \
          APPLE_API_KEY_ID="$CMC_APPLE_KEY_ID" \
          APPLE_API_ISSUER_ID="$CMC_APPLE_ISSUER_ID" \
            "$GITHUB_WORKSPACE/release-tools/script/sign_macos_release.sh" \
              "$GITHUB_WORKSPACE/source/dist/Clean My Codex.app" \
              "$OUTPUT_ARCHIVE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-macos-${{ matrix.arch }}
          path: |
            source/dist/Clean-My-Codex-macOS-${{ matrix.arch }}-v${{ needs.preflight.outputs.version }}.zip
            source/dist/Clean-My-Codex-macOS-${{ matrix.arch }}-v${{ needs.preflight.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Sign Windows x64
    needs: preflight
    environment: release-signing
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"
      - name: Install build dependency
        working-directory: source
        run: python -m pip install --disable-pip-version-check -r requirements-windows-build.txt
      - name: Audit and test tagged source
        working-directory: source
        run: |
          python scripts/audit_release.py . --allowlist PUBLIC_RELEASE_FILES.txt
          python -m unittest discover -s tests
      - name: Build and smoke test app
        working-directory: source
        shell: pwsh
        run: ./script/build_windows_app.ps1 -Python python
      - name: Import certificate, sign, verify, and package
        env:
          CMC_WIN_PFX_B64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CMC_WIN_PFX_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:CMC_WIN_PFX_B64) -or [string]::IsNullOrWhiteSpace($env:CMC_WIN_PFX_PASS)) {
              throw "A required release-signing environment secret is missing."
          }

          $PfxPath = Join-Path $env:RUNNER_TEMP "clean-my-codex-signing.pfx"
          [IO.File]::WriteAllBytes($PfxPath, [Convert]::FromBase64String($env:CMC_WIN_PFX_B64))
          $SecurePassphrase = ConvertTo-SecureString $env:CMC_WIN_PFX_PASS -AsPlainText -Force
          $Imported = @(Import-PfxCertificate -FilePath $PfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $SecurePassphrase)
          try {
              $Certificate = $Imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
              if (-not $Certificate) {
                  throw "The PFX did not import a certificate with a private key."
              }
              $PackageRoot = Join-Path $env:GITHUB_WORKSPACE "source\dist\Clean My Codex Windows x64"
              $OutputArchive = Join-Path $env:GITHUB_WORKSPACE "source\dist\Clean-My-Codex-Windows-x64-v$env:RELEASE_VERSION.zip"
              & (Join-Path $env:GITHUB_WORKSPACE "release-tools\script\sign_windows_release.ps1") `
                  -PackageRoot $PackageRoot `
                  -CertificateThumbprint $Certificate.Thumbprint `
                  -OutputArchive $OutputArchive
          } finally {
              foreach ($Certificate in $Imported) {
                  Remove-Item "Cert:\CurrentUser\My\$($Certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
              }
              Remove-Item $PfxPath -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-windows-x64
          path: |
            source/dist/Clean-My-Codex-Windows-x64-v${{ needs.preflight.outputs.version }}.zip
            source/dist/Clean-My-Codex-Windows-x64-v${{ needs.preflight.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify and update GitHub release
    needs: [preflight, macos, windows]
    environment: release-signing
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: signed-*
          path: dist/release-assets
          merge-multiple: true
      - name: Verify signed asset inventory and checksums
        run: >-
          python scripts/verify_signed_release_assets.py
          --directory dist/release-assets
          --version "${{ needs.preflight.outputs.version }}"
      - name: Upload signed assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Promote release after successful publication
        if: ${{ inputs.promote_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: >-
          gh release edit "$RELEASE_TAG"
          --prerelease=false
          --latest
          --title "Clean My Codex $RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
