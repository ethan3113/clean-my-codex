name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Python 3.10
            os: ubuntu-latest
            python-version: "3.10"
          - name: Linux / Python 3.13
            os: ubuntu-latest
            python-version: "3.13"
          - name: Windows x64 / Python 3.13
            os: windows-2025
            python-version: "3.13"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Audit repository inventory
        run: python scripts/audit_release.py . --allowlist PUBLIC_RELEASE_FILES.txt
      - name: Test Python
        run: python -m unittest discover -s tests
      - name: Compile Python
        run: python -m compileall -q clean_my_codex scripts script
      - name: Check JavaScript
        run: node --check static/app.js
      - name: Build and audit release
        run: python scripts/build_release.py --output-dir "${{ runner.temp }}/release"
