name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Python 3.10
            os: ubuntu-latest
            python-version: "3.10"
          - name: Linux / Python 3.13
            os: ubuntu-latest
            python-version: "3.13"
          - name: Windows x64 / Python 3.13
            os: windows-2025
            python-version: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Audit repository inventory
        run: python scripts/audit_release.py . --allowlist PUBLIC_RELEASE_FILES.txt
      - name: Test Python
        run: python -m unittest discover -s tests
      - name: Compile Python
        run: python -m compileall -q clean_my_codex scripts script
      - name: Check JavaScript
        run: node --check static/app.js
      - name: Build and audit release
        run: python scripts/build_release.py --output-dir "${{ runner.temp }}/release"
